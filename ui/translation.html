<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZotAgent-PDF · 对照翻译</title><link rel="stylesheet" href="translation.css"></head><body><main><header><div><small>ZOTAGENT · PDF</small><h1>文献对照翻译</h1><p>保留原始 PDF，将译文保存为文献附件。</p></div><span id="connection">连接中…</span></header><nav role="tablist" aria-label="PDF 翻译工作区"><button id="tab-tasks" data-tab="tasks" class="active" role="tab" aria-selected="true" aria-controls="tasks">翻译任务</button><button id="tab-history" data-tab="history" role="tab" aria-selected="false" aria-controls="history" tabindex="-1">翻译历史</button><button id="tab-settings" data-tab="settings" role="tab" aria-selected="false" aria-controls="settings" tabindex="-1">翻译设置</button></nav><div id="notice" role="status" aria-live="polite"></div><div id="recovery" role="status"></div><div id="engine-setup" class="setup-banner" hidden><span id="engine-setup-message"></span><button id="engine-setup-start" type="button">准备翻译环境</button></div><section role="tabpanel" aria-labelledby="tab-tasks" id="tasks"><article><h2>选择论文</h2><div class="row"><input id="query" placeholder="搜索 Zotero 文献库…"><button id="search">搜索</button><button id="selected">载入 Zotero 已选文献</button><button id="current">当前论文</button></div><div class="row selection-toolbar"><span id="selection-count" class="hint">未选择论文</span><button id="select-all" disabled>全选</button><button id="select-none" disabled>取消选择</button></div><div id="sources" class="sources"></div><div class="row options"><label>处理方式<select id="mode"><option value="compare">双语对照（左右并排）</option><option value="translate">翻译 PDF（译文与双语版）</option><option value="crop-compare">双语对照（裁剪后拼接）</option><option value="crop">裁剪 PDF</option></select></label><label>目标语言<select id="targetLang"><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option><option value="en">英语</option><option value="ja">日语</option></select></label><button id="start" class="primary">开始处理</button></div></article><article><div class="row between"><h2>当前任务</h2><span id="summary"></span></div><p class="hint">任务在后台依次运行。关闭窗口后仍可继续；正在运行的任务由翻译引擎执行。</p><div id="jobs"></div></article></section><section role="tabpanel" aria-labelledby="tab-history" id="history" hidden><article><div class="row between"><h2>翻译历史</h2><div class="row"><input id="history-query" aria-label="搜索翻译历史" placeholder="搜索任务标题…"><select id="history-filter" aria-label="筛选翻译历史"><option value="all">全部状态</option><option value="completed">已完成</option><option value="failed">失败</option><option value="cancelled">已取消</option></select></div></div><div id="past"></div><div class="history-pagination"><button id="history-prev" type="button">← 上一页</button><span id="history-page" class="hint"></span><button id="history-next" type="button">下一页 →</button></div></article></section><section role="tabpanel" aria-labelledby="tab-settings" id="settings" hidden><article><h2>翻译引擎</h2><p class="hint">引擎负责 PDF 解析与排版，翻译源决定文本译文。免费服务可直接选择；付费服务需配置 API 密钥。聊天模型与 PDF 翻译分别设置。</p><label>服务地址<input id="endpoint" value="http://127.0.0.1:8894"></label><div class="row options"><label>引擎<select id="engine"><option value="pdf2zh_next">PDFMathTranslate Next</option><option value="pdf2zh" disabled>旧版引擎（此环境未安装）</option></select></label><label>翻译源<select id="service"><option value="bing">Bing（免费）</option><option value="google">Google（免费）</option><option value="siliconflowfree">硅基流动免费服务</option><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="openaicompatible">OpenAI 兼容</option></select></label><label>原文语言<select id="sourceLang"><option value="en">英语</option><option value="zh-CN">简体中文</option><option value="ja">日语</option><option value="de">德语</option></select></label></div><div id="provider-config" class="provider-config" hidden><strong id="provider-heading">翻译源配置</strong><p id="provider-status" class="hint"></p><label>API 密钥<input id="provider-key" type="password" autocomplete="new-password" placeholder="输入密钥；留空保留已保存的密钥"></label><label>模型名称<input id="provider-model" autocomplete="off" placeholder="留空使用服务默认模型"></label><label id="provider-url-label">服务地址<input id="provider-url" autocomplete="off" placeholder="留空使用服务默认地址"></label><p class="hint">密钥以明文保存在本机及翻译引擎配置中，翻译时发送给所选服务；请使用该服务的 API 密钥。</p></div><label class="check"><input id="autoImport" type="checkbox" checked>完成后自动添加到原文献</label><div class="row"><button id="save" class="primary">保存设置</button><button id="probe">检查连接</button></div></article></section><footer>任务历史与翻译结果保存在 ZotAgent 本地数据目录。</footer></main><script src="translation.js"></script></body></html>
